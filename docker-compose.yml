name: midnight-ballot

services:
  # Local proof server for organizer CLI scripts only — the browser client
  # proves via the connected wallet's own local proof server instead. See
  # docs/THREAT_MODEL.md "Proof-server exposure".
  proof-server:
    image: midnightntwrk/proof-server:8.1.0
    ports:
      - '6300:6300'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://localhost:6300/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    env_file:
      - .env
    environment:
      PROOF_SERVER_URL: http://proof-server:6300
    ports:
      - '8080:8080'
    volumes:
      - server-data:/app/data
    depends_on:
      proof-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: packages/client/Dockerfile
    ports:
      - '5173:80'
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://localhost/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  server-data:
