name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Install Compact compiler
        env:
          COMPACTC_VERSION: '0.31.1'
        run: npm run -w packages/contracts fetch-compactc

      - name: Compile contracts
        run: npm run compile:contracts

      - name: Typecheck
        run: npm run typecheck

      - name: Contract tests
        run: npm run test:contracts

      - name: Server tests
        run: npm run test:server

      - name: Build (shared -> server -> client)
        run: npm run build

      - name: npm audit (non-blocking)
        run: npm audit --omit=dev --audit-level=high || echo "::warning::npm audit reported issues — review before release, not blocking CI"

  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Compact compiler
        env:
          COMPACTC_VERSION: '0.31.1'
        run: npm run -w packages/contracts fetch-compactc

      - name: Compile contracts (needed for client's ZK artifacts)
        run: npm run compile:contracts

      - name: Copy ZK artifacts into client public dir
        run: |
          mkdir -p packages/client/public/zk
          cp -r packages/contracts/managed/ballot/keys packages/client/public/zk/keys
          cp -r packages/contracts/managed/ballot/zkir packages/client/public/zk/zkir

      - uses: docker/setup-buildx-action@v3

      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          push: false
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Build client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/client/Dockerfile
          push: false
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client
